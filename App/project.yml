name: SendEhr
options:
  bundleIdPrefix: com.amritus
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  SendEhrKit:
    path: ..
settings:
  base:
    DEVELOPMENT_TEAM: 3A3L2C6DFB
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: 1.1.1
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    OTHER_CODE_SIGN_FLAGS: "--timestamp"
    CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO   # no get-task-allow in shipped builds
  configs:
    # A plain "xcodebuild build" leaves deployment postprocessing off, so the
    # products are never stripped and keep the linker's debug map (absolute
    # source and object-file paths of the build machine). On: the app and the
    # extension are stripped (STRIP_STYLE all) after their dSYMs are made.
    Release:
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_STYLE: all
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
targets:
  SendEhr:
    type: application
    platform: macOS
    sources: [SendEhr]
    dependencies:
      - package: SendEhrKit
        product: SendEhrKit
      - package: SendEhrKit
        product: SendEhrKitUI
      - target: SendEhrFinderSync
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amritus.sendehr
        PRODUCT_NAME: SendEhr
        INFOPLIST_FILE: SendEhr/Info.plist
        CODE_SIGN_ENTITLEMENTS: SendEhr/SendEhr.entitlements
        GENERATE_INFOPLIST_FILE: NO
  SendEhrFinderSync:
    type: app-extension
    platform: macOS
    sources: [FinderSync]
    dependencies:
      - package: SendEhrKit
        product: SendEhrKit
      - package: SendEhrKit
        product: SendEhrKitUI
      - sdk: FinderSync.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.amritus.sendehr.findersync
        PRODUCT_NAME: SendEhrFinderSync
        INFOPLIST_FILE: FinderSync/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderSync/FinderSync.entitlements
        GENERATE_INFOPLIST_FILE: NO
